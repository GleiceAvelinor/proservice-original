services:
  # ─── BANCO DE DADOS POSTGRESQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: saas_postgres_db
    restart: always
    environment:
      POSTGRES_DB: saas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbsaas290784
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── APLICAÇÃO DJANGO MULTI-TENANT ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_django_web
    restart: always
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-saas-multi-tenant-dev-key-change-in-production-123456789
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,.localhost,ji.localhost,levi.localhost,web,db
      - DB_NAME=saas_db
      - DB_USER=postgres
      - DB_PASSWORD=dbsaas290784
      - DB_HOST=db
      - DB_PORT=5432
      - DB_SSLMODE=prefer
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - BASE_DOMAIN=localhost
      # Defina os e-mails dos Admins Globais do SaaS separados por vírgula.
      # Deixe vazio para bloquear todos (fail-safe).
      - SAAS_ADMIN_EMAILS=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ─── MESSAGE BROKER REDIS ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    ports:
      - "6379:6379"

  # ─── WORKER DO CELERY ──────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_celery_worker
    restart: always
    working_dir: /app
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - SECRET_KEY=django-insecure-saas-multi-tenant-dev-key-change-in-production-123456789
      - DEBUG=True
      - DB_NAME=saas_db
      - DB_USER=postgres
      - DB_PASSWORD=dbsaas290784
      - DB_HOST=db
      - DB_PORT=5432
      - DB_SSLMODE=prefer
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - SAAS_ADMIN_EMAILS=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data: