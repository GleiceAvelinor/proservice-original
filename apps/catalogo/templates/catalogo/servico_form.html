{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ titulo }} — {{ current_tenant.name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center pt-2 pb-3 mb-4 border-bottom">
    <h1 class="h2 fw-bold mb-0">{{ titulo }}</h1>
    <a href="{% url 'catalogo:servicos' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Voltar</a>
</div>

<div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">
        {% crispy form %}
    </div>
</div>
{% endblock %}
