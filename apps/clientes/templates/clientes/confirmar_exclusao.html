{% extends 'base.html' %}

{% block title %}Excluir Cliente — {{ current_tenant.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm rounded-3">
            <div class="card-header bg-danger text-white py-3">
                <h5 class="fw-bold mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Confirmar Exclusão</h5>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5">Tem certeza que deseja excluir o cliente <strong>{{ object.nome }}</strong>?</p>
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4 py-2 me-2">Sim, Excluir</button>
                    <a href="{% url 'clientes:lista' %}" class="btn btn-secondary px-4 py-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
