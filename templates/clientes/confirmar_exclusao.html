{% extends 'base.html' %}

{% block title %}Excluir Cliente — {{ object.nome }}{% endblock %}

{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 text-center">
            <div class="card-body p-4 p-sm-5">
                <div class="text-danger mb-3" style="font-size: 3.5rem;">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <h3 class="fw-bold mb-2">Confirmar Exclusão</h3>
                <p class="text-muted mb-4">
                    Tem certeza de que deseja excluir o cliente <strong>{{ object.nome }}</strong>? Esta ação não poderá ser desfeita.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'clientes:lista' %}" class="btn btn-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-danger px-4 fw-semibold">Sim, Excluir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
